const FIELD_META = {
  voltage:   { label: 'Bipolar Voltage', unit: 'mV', cmap: 'rhythmia_voltage', range: [0.05, 1.5] },
  unipolar:  { label: 'Unipolar Voltage', unit: 'mV', cmap: 'rhythmia_voltage', range: [0.1, 8.3] },
  lat:       { label: 'LAT', unit: 'ms', cmap: 'rhythmia_lat', range: null },
  activation:{ label: 'Activation (LAT)', unit: 'ms', cmap: 'rhythmia_lat', range: null },
  map_data:  { label: 'Map Data', unit: '', cmap: 'rhythmia_voltage', range: null },
};

function buildModeOptions(data) {
  const sel = document.getElementById('mode');
  sel.innerHTML = '';
  const add = (val, label) => { const o = document.createElement('option'); o.value = val; o.textContent = label; sel.appendChild(o); };

  let firstScalar = null;
  for (const n of data.scalarNames) {
    const meta = FIELD_META[n.toLowerCase()] || { label: n, unit: '', cmap: 'rhythmia_voltage', range: null };
    add('scalar:' + n, meta.label);
    if (!firstScalar) firstScalar = n;
  }
  if (data.colors) add('vertex', 'Vertex Colors');
  add('tissue', 'Tissue (uniform)');

  if (firstScalar) selectMode('scalar:' + firstScalar, data);
  else if (data.colors) selectMode('vertex', data);
  else selectMode('tissue', data);
  sel.value = state.mode;
}

function selectMode(mode, data = current) {
  state.mode = mode;
  state.isolateScar = false;
  _readoutDirty = true;      // anderes Feld -> Hover-Wert neu bestimmen
  const _iso = document.getElementById('area-isolate'); if (_iso) _iso.classList.remove('on');
  const legend = document.getElementById('legend');
  if (mode.startsWith('scalar:')) {
    const field = mode.slice(7);
    const meta = FIELD_META[field.toLowerCase()] || { unit: '', cmap: 'rhythmia_voltage', range: null };
    state.cmap = meta.cmap; state.unit = meta.unit;
    state.fieldRange = dataRange(data.scalars[field]);
    if (!state.windows[field]) {
      let range = meta.range || state.fieldRange;
      if (field === 'voltage' && current && current.source === 'rhythmia') range = [0.05, 0.5];  // atrial bipolar standard
      state.windows[field] = { vmin: range[0], vmax: range[1] };
    }
    const isVolt = (field === 'voltage' || field === 'unipolar');
    state.confMask = isVolt && current && current.source === 'rhythmia';
    const cmRow = document.getElementById('conf-mask-row');
    const cmChip = document.getElementById('conf-mask');
    const cmIn = document.getElementById('conf-mask-th');
    const cmLbl = document.getElementById('conf-mask-th-lbl');
    if (cmRow) cmRow.style.display = isVolt ? 'flex' : 'none';
    if (cmChip) cmChip.classList.toggle('on', state.confMask);
    if (cmIn) cmIn.value = round(state.confMaskTh);
    if (cmLbl) cmLbl.textContent = round(state.confMaskTh);
    state.vmin = state.windows[field].vmin;
    state.vmax = state.windows[field].vmax;
    document.getElementById('cmap').value = state.cmap;
    document.getElementById('vmin').value = round(state.vmin);
    document.getElementById('vmax').value = round(state.vmax);
    document.getElementById('range-unit').textContent = meta.unit ? '· ' + meta.unit : '';
    document.getElementById('grp-cmap').style.display = '';
    document.getElementById('grp-range').style.display = '';
    document.getElementById('grp-smooth').style.display = '';
    legend.classList.add('show');
    buildPresets(field);
    syncSliderBounds();
    updateActivationUI(field);
  } else {
    document.getElementById('grp-cmap').style.display = 'none';
    document.getElementById('grp-range').style.display = 'none';
    document.getElementById('grp-smooth').style.display = 'none';
    legend.classList.remove('show');
    updateActivationUI(null);
  }
  recomputeArea();
}

// Surface-area quantification for the active scalar field, bucketed by the color window.
function recomputeArea() {
  const grp = document.getElementById('grp-area');
  const field = state.mode && state.mode.startsWith('scalar:') ? state.mode.slice(7) : null;
  if (!current || !field || !current.scalars[field]) { grp.style.display = 'none'; return; }
  grp.style.display = '';
  // Dieselbe Quelle wie das Rendering (geglättet + Conf-Maske), sonst gehören
  // die cm²-Zahlen sichtbar nicht zu dem, was auf dem Schirm steht.
  const r = areaByThreshold(current.positions, current.faces, visibleScalar(field), state.vmin, state.vmax);
  const cm2 = a => (a / 100).toFixed(1);
  const pct = a => (r.total > 0 ? (a / r.total * 100).toFixed(1) : '0.0');
  const lo = round(state.vmin), hi = round(state.vmax), u = state.unit ? ' ' + state.unit : '';
  const totalEl = document.getElementById('area-total');
  const midEl = document.getElementById('area-mid');
  if (totalEl) totalEl.textContent = `${cm2(r.total)} cm²`;
  if (midEl) midEl.textContent = `Window ${cm2(r.border)} · ${pct(r.border)}%`;
  const el = document.getElementById('area-readout');
  el.textContent = '';
  const line = (txt) => { const d = document.createElement('div'); d.textContent = txt; el.appendChild(d); };
  line(`< ${lo}${u}:  ${cm2(r.scar)} cm² · ${pct(r.scar)}%`);
  line(`${lo}–${hi}${u}:  ${cm2(r.border)} cm² · ${pct(r.border)}%`);
  line(`> ${hi}${u}:  ${cm2(r.healthy)} cm² · ${pct(r.healthy)}%`);
  if (r.unmapped > 0) line(`unmapped: ${pct(r.unmapped)}%`);
}

// Single source of truth for the active field's color window.
function setWindow(vmin, vmax) {
  const [lo, hi] = state.fieldRange;
  ({ vmin, vmax } = clampWindow(vmin, vmax, lo, hi));
  state.vmin = vmin; state.vmax = vmax;
  if (state.mode && state.mode.startsWith('scalar:')) {
    const field = state.mode.slice(7);
    if (state.windows[field]) { state.windows[field].vmin = vmin; state.windows[field].vmax = vmax; }
  }
  document.getElementById('vmin').value = round(vmin);
  document.getElementById('vmax').value = round(vmax);
  document.getElementById('vmin-s').value = sliderPosition(vmin);
  document.getElementById('vmax-s').value = sliderPosition(vmax);
  const ro = document.getElementById('vwin-readout');
  if (ro) ro.textContent = round(vmin) + ' – ' + round(vmax);
  applyColors();
  if (state.mode && state.mode.startsWith('scalar:') && isLatField(state.mode.slice(7))) {
    syncTimelineToWindow();
    // Die Kurve zeigt die *sichtbaren* Werte; Fenster und Glättung ändern sie.
    drawSkyline(state.mode.slice(7));
  }
  recomputeArea();
}

/* Die Regler tragen eine Position (0..1000), keinen Messwert.
 *
 * Spannung wird am unteren Ende abgelesen — Narbe unter 0,5 mV, gesundes
 * Gewebe über 1,5 — und die Daten reichen bis 8. Linear lag die ganze
 * Entscheidung im ersten Fünftel der Bahn, ein Pixel waren 40 µV. Die Kurve
 * steht in epmap.js, mit den Marken darunter. */
const SLIDER_STEPS = 1000;

function currentCurve() {
  const field = state.mode && state.mode.startsWith('scalar:') ? state.mode.slice(7) : '';
  return windowCurve(field);
}

function sliderValue(position) {
  const [lo, hi] = state.fieldRange;
  return positionToValue(position / SLIDER_STEPS, lo, hi, currentCurve());
}

function sliderPosition(value) {
  const [lo, hi] = state.fieldRange;
  return Math.round(valueToPosition(value, lo, hi, currentCurve()) * SLIDER_STEPS);
}

function syncSliderBounds() {
  const a = document.getElementById('vmin-s'), b = document.getElementById('vmax-s');
  for (const el of [a, b]) { el.min = 0; el.max = SLIDER_STEPS; el.step = 1; }
  a.value = sliderPosition(state.vmin);
  b.value = sliderPosition(state.vmax);
  // Auch hier, nicht nur in setWindow: beim Laden wird das Fenster gesetzt,
  // ohne dass jemand einen Regler anfasst — die Anzeige blieb bis zum ersten
  // Ziehen leer.
  const readout = document.getElementById('vwin-readout');
  if (readout) readout.textContent = round(state.vmin) + ' – ' + round(state.vmax);
  drawWindowScale();
}

/** Die beschrifteten Marken unter der Bahn. */
function drawWindowScale() {
  const box = document.getElementById('vwin-scale');
  if (!box) return;
  box.textContent = '';
  const [lo, hi] = state.fieldRange;
  const curve = currentCurve();
  for (const value of windowTicks(lo, hi, curve)) {
    const mark = document.createElement('span');
    mark.style.left = (valueToPosition(value, lo, hi, curve) * 100).toFixed(2) + '%';
    mark.textContent = round(value);
    box.appendChild(mark);
  }
}

function buildPresets(field) {
  const box = document.getElementById('vpresets');
  box.innerHTML = '';
  for (const p of voltagePresets(field)) {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = p.label;
    btn.onclick = () => {
      if (p.lo == null) { const [lo, hi] = dataRange(current.scalars[field]); setWindow(lo, hi); }
      else setWindow(p.lo, p.hi);
    };
    box.appendChild(btn);
  }
}

function isLatField(field) { const f = (field || '').toLowerCase(); return f === 'lat' || f === 'activation'; }

/* Die Aktivierungskurve zeichnen: Fläche über Zeit.
 *
 * Absichtlich klein und ohne Achsen — sie beantwortet eine Ja/Nein-Frage
 * ("läuft die Welle durch oder bricht sie ein?"), und die Zahlen dazu stehen
 * als Zeitspanne daneben. */
function drawSkyline(field) {
  const canvas = document.getElementById('skyline');
  const note = document.getElementById('skyline-quiet');
  if (!canvas || !current) return;
  const scale = window.devicePixelRatio || 1;
  const width = canvas.clientWidth || 240, height = 54;
  if (canvas.width !== Math.round(width * scale)) {
    canvas.width = Math.round(width * scale);
    canvas.height = Math.round(height * scale);
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.clearRect(0, 0, width, height);

  const histogram = EPM.activationHistogram(current.positions, current.faces,
                                            visibleScalar(field));
  const bins = histogram.bins;
  if (!bins.length) { note.textContent = ''; return; }

  const peak = Math.max(...bins.map(b => b.fraction)) || 1;
  const quiet = EPM.quietestWindow(histogram, Math.max(10, (histogram.hi - histogram.lo) / 12));

  // Die stillste Strecke zuerst, damit die Kurve darüber liegt.
  if (quiet) {
    const at = (t) => ((t - histogram.lo) / (histogram.hi - histogram.lo)) * width;
    ctx.fillStyle = themeToken('--accent-wash') || 'rgba(69,198,218,0.12)';
    ctx.fillRect(at(quiet.fromMs), 0, Math.max(2, at(quiet.toMs) - at(quiet.fromMs)), height);
    note.textContent = `${round(quiet.fromMs)}–${round(quiet.toMs)} ms`;
  } else {
    note.textContent = '';
  }

  ctx.beginPath();
  bins.forEach((bin, i) => {
    const x = (i / (bins.length - 1)) * width;
    const y = height - 2 - (bin.fraction / peak) * (height - 6);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = themeToken('--accent') || '#45c6da';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.lineTo(width, height); ctx.lineTo(0, height); ctx.closePath();
  ctx.fillStyle = themeToken('--accent-wash') || 'rgba(69,198,218,0.12)';
  ctx.fill();
}

function updateActivationUI(field) {
  const grp = document.getElementById('grp-anim');
  if (!field || !isLatField(field)) { grp.style.display = 'none'; stopAnim(); return; }
  grp.style.display = '';
  state.anim.engaged = false;
  syncTimelineToWindow();
  drawSkyline(field);
}

// The Ausschnitt [t0,t1] is the LAT color window (state.vmin/vmax). Keep the
// timeline + band sliders bounded to it.
function syncTimelineToWindow() {
  const t0 = state.vmin, t1 = state.vmax, W = (t1 - t0) || 1;
  const cur = document.getElementById('anim-cursor');
  cur.min = t0; cur.max = t1; cur.step = W / 500;
  if (state.anim.t < t0 || state.anim.t > t1) state.anim.t = t0;
  cur.value = state.anim.t;
  const band = document.getElementById('anim-band');
  band.min = W / 200; band.max = W; band.step = W / 200;
  if (!state.anim.band || state.anim.band > W) state.anim.band = W * 0.08;
  band.value = state.anim.band;
  updateAnimReadout();
}

function updateAnimReadout() {
  document.getElementById('anim-t').textContent = '· ' + round(state.anim.t) + ' ms';
}

let _animLast = null;
function startAnim() {
  if (!state.mode || !state.mode.startsWith('scalar:') || !isLatField(state.mode.slice(7))) return;
  state.anim.playing = true; state.anim.engaged = true; _animLast = null;
  const b = document.getElementById('anim-play'); b.textContent = T('map.pause'); b.classList.add('on');
}
function stopAnim() {
  state.anim.playing = false;
  const b = document.getElementById('anim-play'); b.textContent = T('map.play'); b.classList.remove('on');
}
function stepAnim(now) {
  if (!state.anim.playing || !mesh || !state.mode.startsWith('scalar:') || !isLatField(state.mode.slice(7))) { _animLast = now; return; }
  if (_animLast == null) { _animLast = now; return; }
  let dt = (now - _animLast) / 1000; _animLast = now;
  if (dt > 0.1) dt = 0.1;   // clamp jumps after tab-blur
  state.anim.t = advanceCursor(state.anim.t, state.vmin, state.vmax, dt, state.anim.speed, state.anim.mode);
  document.getElementById('anim-cursor').value = state.anim.t;
  updateAnimReadout();
  applyColors();
}

function round(v) { const a = Math.abs(v); return a >= 100 ? v.toFixed(0) : a >= 1 ? v.toFixed(2) : v.toFixed(3); }

// Per-vertex adjacency (built lazily, cached on the mesh data).
function getAdjacency() {
  if (!current._adjacency) current._adjacency = buildAdjacencyCSR(current.faces, current.positions.length / 3);
  return current._adjacency;
}
// Display values for a scalar field: raw if smoothLevel 0, else memoized Laplacian-smoothed.
// P-4: Laplace-Glättung ist iterativ — Stufe k-1 ist exakt der Startwert für
// Stufe k. Beim Ziehen des Reglers von 0 auf 10 sind das 10 statt 55 Durchläufe
// (bitgleiches Ergebnis).
let _smoothCache = null;

/* Wie verschieden zwei Nachbarn sein müssen, damit die Glättung sie trennt.
 *
 * Aus den Daten, nicht aus dem Farbfenster: auf dieser Karte liegt der Median
 * der Nachbarschaftsunterschiede bei 0,023 mV, ein Fünftel des Fensters aber
 * bei 0,29 — damit galt jeder Nachbar als gleich und die Glättung war wieder
 * die gleichmäßige. Genommen wird das 90. Perzentil (hier 0,26 mV): darunter
 * liegen die Plateaugrenzen der Hersteller-Interpolation, die als Pflasterung
 * ins Bild schlagen, darüber die echten Übergänge. Das 75. war zu streng — es
 * hielt die Pflasterkanten fest, und genau die fielen als "kantig" auf.
 *
 * Einmal je Netz und Feld; die Verteilung ändert sich beim Glätten kaum. */
function smoothingEdge(field) {
  if (_edgeScale && _edgeScale.mesh === current && _edgeScale.field === field) {
    return _edgeScale.value;
  }
  const value = edgeStepScale(current.scalars[field], getAdjacency(), 0.9);
  _edgeScale = { mesh: current, field, value };
  return value;
}
let _edgeScale = null;
let _edgeLength = null;

/** Die mittlere Kantenlänge dieses Netzes, gemerkt — der Maßstab für den Radius. */
function meshEdgeLength() {
  if (_edgeLength && _edgeLength.mesh === current) return _edgeLength.value;
  const value = medianEdgeLength(current.positions, getAdjacency()) || 1;
  _edgeLength = { mesh: current, value };
  return value;
}

function displayScalar(field) {
  const raw = current.scalars[field];
  const level = state.smoothLevel;
  if (!level) return raw;
  const edge = smoothingEdge(field);
  /* Ein Zug über eine Strecke statt zehn über Nachbarschaftsringe.
   *
   * Wiederholte bilaterale Durchgänge treppen — gemessen auf dieser Karte
   * wuchs die Zahl der Stufen über 0,5 mV bei zehn Durchgängen von 2.100 auf
   * 2.820: der Filter erzeugte die Kanten, die er erhalten sollte. Ein
   * einziger Durchgang über einen Radius kann das nicht, und der Radius ist in
   * Millimetern gedacht, damit ein feines und ein grobes Netz gleich stark
   * geglättet werden. */
  const radius = level * meshEdgeLength() * 0.6;
  const warm = _smoothCache && _smoothCache.mesh === current
            && _smoothCache.field === field && _smoothCache.level === level
            && _smoothCache.edge === edge;
  if (warm) return _smoothCache.values;
  const values = smoothScalarSpatial(raw, getAdjacency(), current.positions, radius, edge);
  _smoothCache = { mesh: current, field, level, edge, values };
  return values;
}
// Werte so, wie der Nutzer sie sieht: geglättet, und Vertices, die die
// Conf-Maske ausblendet, als NaN (= unmapped). Rendering, Flächenstatistik und
// Export teilen sich diese Quelle, damit die cm²-Zahlen und die exportierten
// Farben zum Bild auf dem Schirm gehören.
function confMaskActive(field) {
  return !!state.confMask && (field === 'voltage' || field === 'unipolar');
}
let _visibleCache = null;
function visibleScalar(field) {
  const s = displayScalar(field);
  if (!confMaskActive(field)) return s;
  const key = { mesh: current, field, level: state.smoothLevel, th: state.confMaskTh };
  if (_visibleCache && _visibleCache.mesh === key.mesh && _visibleCache.field === key.field
      && _visibleCache.level === key.level && _visibleCache.th === key.th) return _visibleCache.values;
  const out = new Float32Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s[i] <= state.confMaskTh ? NaN : s[i];
  _visibleCache = { ...key, values: out };
  return out;
}

function applyColors() {
  if (!mesh) return;
  const col = mesh.geometry.getAttribute('color');
  const arr = col.array;
  const n = current.positions.length / 3;

  if (state.mode === 'tissue') {
    const tr = srgbToLinear(214), tg = srgbToLinear(150), tb = srgbToLinear(140);
    for (let i = 0; i < n; i++) { arr[i*3]=tr; arr[i*3+1]=tg; arr[i*3+2]=tb; }
  } else if (state.mode === 'vertex' && current.colors) {
    const c = current.colors;
    for (let i = 0; i < n*3; i++) arr[i] = srgbToLinear(c[i]);
  } else if (state.mode.startsWith('scalar:')) {
    const field = state.mode.slice(7);
    const s = visibleScalar(field);                   // geglättet + Conf-Maske
    const table = linLut(state.cmap);                 // already-linear LUT (perf option A)
    const vmin = state.vmin, vmax = state.vmax, span = (vmax - vmin) || 1e-9;
    const uR = srgbToLinear(UNMAPPED[0]), uG = srgbToLinear(UNMAPPED[1]), uB = srgbToLinear(UNMAPPED[2]);
    const animOn = isLatField(field) && state.anim.engaged;
    const t = state.anim.t, band = state.anim.band, W = vmax - vmin, mode = state.anim.mode;
    for (let i = 0; i < n; i++) {
      const v = s[i];
      if (Number.isNaN(v)) { arr[i*3]=uR; arr[i*3+1]=uG; arr[i*3+2]=uB; continue; }
      if (state.isolateScar && v >= vmin) { arr[i*3]=0.10; arr[i*3+1]=0.10; arr[i*3+2]=0.10; continue; }
      let tt = (v - vmin) / span; tt = tt < 0 ? 0 : tt > 1 ? 1 : tt;
      const idx = (tt * 255) | 0;
      let r = table[idx*3], g = table[idx*3+1], b = table[idx*3+2];
      if (animOn) {
        const h = highlightFactor(v, t, W, band, mode);
        if (h > 0) { r += (1 - r) * h; g += (1 - g) * h; b += (1 - b) * h; }  // blend toward linear white
      }
      arr[i*3] = r; arr[i*3+1] = g; arr[i*3+2] = b;
    }
  }
  col.needsUpdate = true;
  drawLegend();
}

/* ---------- legend ---------- */
// P-5: applyColors() läuft während Wiedergabe und Video-Export in jedem Frame.
// Die Legende hängt aber nur an Farbskala, Fenster, Einheit und Modus — ohne
// diesen Wächter wären das 280 fillRect plus DOM-Neubau, 60-mal pro Sekunde.
let _legendKey = null;
function drawLegend() {
  if (!state.mode || !state.mode.startsWith('scalar:')) { _legendKey = null; return; }
  const key = state.mode + '|' + state.cmap + '|' + state.vmin + '|' + state.vmax + '|' + state.unit;
  if (key === _legendKey) return;
  _legendKey = key;
  const cv = document.getElementById('cbar');
  const ctx = cv.getContext('2d');
  const table = lut(state.cmap);
  const h = cv.height;
  for (let y = 0; y < h; y++) {
    const t = 1 - y / (h - 1);
    const idx = (t * 255) | 0;
    ctx.fillStyle = `rgb(${table[idx*3]},${table[idx*3+1]},${table[idx*3+2]})`;
    ctx.fillRect(0, y, cv.width, 1);
  }
  const ticksEl = document.getElementById('cbar-ticks');
  ticksEl.innerHTML = '';
  for (let i = 0; i <= 4; i++) {
    const t = 1 - i / 4;
    const val = state.vmin + (state.vmax - state.vmin) * t;
    const sp = document.createElement('span');
    sp.textContent = round(val);
    // Oben und unten stehen die Fenstergrenzen. Wer sie ändern will, klickt
    // sie an — der Weg über die Zahlenfelder im Bedienfeld führt an der
    // Stelle vorbei, an der die Zahl gerade steht.
    if (i === 0 || i === 4) {
      sp.className = 'editable';
      sp.title = T('map.legend.edit');
      sp.ondblclick = () => editLegendBound(sp, i === 0 ? 'max' : 'min');
    }
    ticksEl.appendChild(sp);
  }
  const field = state.mode.slice(7);
  const meta = FIELD_META[field.toLowerCase()] || { label: field, unit: state.unit };
  document.getElementById('legend-cap').textContent = (meta.label || field) + (meta.unit ? ' · ' + meta.unit : '');
}

/** Eine Fenstergrenze an Ort und Stelle ändern.
 *
 * Der Wert wird zum Eingabefeld, Enter übernimmt, Escape lässt ihn stehen. Eine
 * unlesbare Eingabe ändert nichts — stillschweigend auf 0 zu springen wäre eine
 * Karte, die etwas anderes zeigt, als jemand eingetippt hat.
 */
function editLegendBound(span, which) {
  if (span.querySelector('input')) return;
  const before = which === 'min' ? state.vmin : state.vmax;
  const field = document.createElement('input');
  field.type = 'text';
  field.value = round(before);
  field.className = 'legend-edit';
  span.textContent = '';
  span.appendChild(field);
  field.focus();
  field.select();

  // Genau einmal: Escape nimmt das Feld aus dem Baum, das löst `blur` aus, und
  // ohne diesen Riegel übernähme der Abbruch anschließend doch den Wert.
  let settled = false;
  const finish = (accept) => {
    if (settled) return;
    settled = true;
    const typed = parseFloat(field.value.replace(',', '.'));
    span.textContent = round(before);
    if (accept && Number.isFinite(typed)) {
      _legendKey = null;                    // sonst zeichnet die Legende nicht neu
      if (which === 'min') setWindow(typed, state.vmax);
      else setWindow(state.vmin, typed);
    }
  };
  field.onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  };
  field.onblur = () => finish(true);
}

/* ---------- display toggles ---------- */
// P-6: `needsUpdate` zwingt three.js zur Neubewertung des Shader-Programms —
// beim Ziehen des Opazitätsreglers 60-mal pro Sekunde, obwohl sich nur eine
// Uniform ändert. Nur setzen, wenn ein Flag wirklich gekippt ist.
function refreshDisplayToggles() {
  const opacity = +document.getElementById('opacity').value;
  const transparent = opacity < 0.999;
  const flat = !state.smooth;
  let dirty = false;
  if (material.wireframe !== state.wire) { material.wireframe = state.wire; dirty = true; }
  if (material.flatShading !== flat) { material.flatShading = flat; dirty = true; }
  if (material.transparent !== transparent) { material.transparent = transparent; dirty = true; }
  material.opacity = opacity;                 // reine Uniform, kein Neuübersetzen
  if (dirty) material.needsUpdate = true;
}

/* ---------- stats ---------- */
const N = (v, digits = 1) => v.toLocaleString('de-DE',
  { minimumFractionDigits: digits, maximumFractionDigits: digits });

function updateStats(data) {
  document.getElementById('st-verts').textContent = (data.positions.length/3).toLocaleString('de-DE');
  document.getElementById('st-faces').textContent = (data.faces.length/3).toLocaleString('de-DE');
  updateMetrics(data);
}

/* Die Kennzahlen, die eine Karte gelesen wird: Fläche, Volumen, Narbenanteil,
 * Aktivierungszeit. Dieselben Regeln wie `epcore epview metrics`, damit eine
 * Zahl vom Schirm und eine von der Kommandozeile dieselbe ist.
 *
 * Was nicht bestimmbar ist, steht als solches da statt als Zahl: ein offenes
 * Netz hat kein Volumen, und eine Karte ohne Spannungswerte keinen
 * Narbenanteil. */
function updateMetrics(data) {
  const box = document.getElementById('st-metrics');
  box.innerHTML = '';
  if (!data || !data.positions || !data.faces || !data.faces.length) return;

  let m;
  try {
    m = EPM.summarise(data.positions, data.faces, {
      voltage: data.scalars && data.scalars.voltage,
      lat: data.scalars && data.scalars.lat,
    });
  } catch (err) { console.warn('[epview] Kennzahlen:', err); return; }

  const rows = [];
  rows.push([T('map.metrics.area') || 'Oberfläche', `${N(m.surfaceAreaMm2 / 100)} cm²`]);
  if (m.volumeMm3 != null) {
    rows.push([T('map.metrics.volume') || 'Volumen', `${N(m.volumeMm3 / 1000)} ml`]);
  } else {
    // Ein offenes Netz umschließt nichts. Eine Zahl zu zeigen, die die Formel
    // trotzdem liefert, wäre eine erfundene.
    rows.push([T('map.metrics.volume') || 'Volumen',
               `<span class="muted">${T('map.metrics.open') || 'offene Fläche'}</span>`]);
  }
  if (m.lowVoltage && m.lowVoltage.fraction != null) {
    rows.push([`&lt; ${N(m.lowVoltage.thresholdMv, 1)} mV`,
               `${N(m.lowVoltage.areaMm2 / 100)} cm² (${N(m.lowVoltage.fraction * 100)} %)`]);
    rows.push([T('map.metrics.mean') || 'Mittlere Spannung', `${N(m.meanVoltageMv, 2)} mV`]);
    if (m.lowVoltage.unmeasuredMm2 > 0) {
      // Der Anteil bezieht sich auf die gemessene Fläche. Wie viel nicht
      // gemessen wurde, gehört daneben, sonst liest sich der Anteil als
      // Aussage über die ganze Karte.
      rows.push([T('map.metrics.unmeasured') || 'ungemessen',
                 `${N(m.lowVoltage.unmeasuredMm2 / 100)} cm²`]);
    }
  }
  if (m.activation && m.activation.totalActivationTimeMs != null) {
    const a = m.activation;
    const cover = a.coverage < 0.999 ? ` (${N(a.coverage * 100, 0)} %)` : '';
    rows.push([T('map.metrics.tat') || 'Aktivierungszeit',
               `${N(a.totalActivationTimeMs, 0)} ms${cover}`]);
  }

  // Öffnungen: Klappenringe, Venenostien, der transseptale Schnitt. Sie werden
  // gezeigt, auch wenn es keine gibt — Schweigen läse sich als „nicht geprüft",
  // und jede Flächenangabe darüber misst das Gewebe zwischen ihnen.
  if (m.openings) {
    rows.push([T('map.metrics.openings') || 'Öffnungen',
               m.openings.count
                 ? `${m.openings.count}`
                 : `<span class="muted">${T('map.metrics.none') || 'keine'}</span>`]);
  }

  // Leitungsgeschwindigkeit. Der Median, nicht der Mittelwert: die verworfenen
  // Ausreißer sind einseitig (fast gleichzeitige Knoten ergeben unplausibel
  // hohe Werte), und ein Mittelwert darüber wäre nach oben gezogen.
  if (m.activation && data.scalars && data.scalars.lat) {
    try {
      const cv = EPCV.conductionVelocity(data.positions, data.faces, data.scalars.lat);
      const finite = [];
      for (const v of cv.speedMmS) if (Number.isFinite(v)) finite.push(v);
      if (finite.length) {
        finite.sort((x, y) => x - y);
        const median = finite[finite.length >> 1];
        rows.push([T('map.metrics.cv') || 'Leitung (Median)', `${N(median, 0)} mm/s`]);
        if (cv.implausibleVertices) {
          // Verworfen, nicht geklemmt — geklemmte Werte häufen sich am Rand des
          // plausiblen Bereichs und sehen dort wie ein Befund aus.
          rows.push([T('map.metrics.cv.rejected') || 'davon unplausibel',
                     `<span class="muted">${N(cv.implausibleVertices, 0)} ${
                       T('map.metrics.vertices') || 'Knoten'}</span>`]);
        }
      }
    } catch (err) { console.warn('[epview] Leitungsgeschwindigkeit:', err); }
  }

  // Ablation. Gemessen und nicht verortbar ist ein eigener Zustand: im
  // Korpus-Export sind alle 22 Stellen messbar und keine zeichenbar, weil
  // AdjustedPositions.txt leer ist. Ohne diese Zeile sähe der Nutzer keinen
  // einzigen Marker und schlösse daraus, es habe keine Ablation gegeben.
  if (data.ablation && data.ablation.length) {
    const summary = EPA.summarise(data.ablation);
    rows.push([T('map.metrics.ablation') || 'Ablationsstellen',
               `${N(summary.sites, 0)}`]);
    if (summary.totalDeliveryS != null) {
      rows.push([T('map.metrics.ablation.time') || 'Abgabedauer',
                 `${N(summary.totalDeliveryS, 0)} s`]);
    }
    if (summary.powerW && summary.powerW.mean != null) {
      rows.push([T('map.metrics.ablation.power') || 'Leistung (Mittel)',
                 `${N(summary.powerW.mean, 1)} W`]);
    }
    if (!summary.placed) {
      rows.push([T('map.metrics.ablation.unplaced') || 'davon verortet',
                 `<span class="muted">${T('map.metrics.none') || 'keine'}</span>`]);
    } else {
      /* Ob aus den Stellen eine Linie geworden ist. Dauer und Leistung sagen,
       * wie kräftig abgegeben wurde — eine Kette mit einer Lücke leitet
       * trotzdem weiter, und das steht in keiner der beiden Zahlen. */
      if (summary.spacingMm && summary.spacingMm.median != null) {
        rows.push([T('map.metrics.ablation.spacing') || 'Abstand (Median)',
                   `${N(summary.spacingMm.median, 1)} mm`]);
      }
      if (summary.segments > 1) {
        rows.push([T('map.metrics.ablation.segments') || 'Ketten',
                   `<span class="warn-text">${N(summary.segments, 0)}</span>`]);
        if (summary.largestGapMm != null) {
          rows.push([T('map.metrics.ablation.gap') || 'größte Lücke',
                     `<span class="warn-text">${N(summary.largestGapMm, 1)} mm</span>`]);
        }
      } else {
        rows.push([T('map.metrics.ablation.segments') || 'Ketten', '1']);
      }
    }
  }

  for (const [label, value] of rows) {
    const el = document.createElement('div');
    el.innerHTML = `<b>${value}</b> <span>${label}</span>`;
    box.appendChild(el);
  }
}

const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
const readout = document.getElementById('readout');
let hoverX = 0, hoverY = 0;
// P-1: der Raycast lief in *jedem* Frame, auch bei stehender Maus — bei 500k
// Vertices ein Viertel des 16,7-ms-Budgets für nichts. Jetzt nur noch, wenn
// sich Zeiger oder Kamera bewegt haben (`_readoutDirty`).
let _readoutDirty = false, _pointerInside = false;
renderer.domElement.addEventListener('pointermove', (e) => {
  hoverX = e.clientX; hoverY = e.clientY;
  ptr.x = (e.clientX / innerWidth) * 2 - 1;
  ptr.y = -(e.clientY / innerHeight) * 2 + 1;
  _pointerInside = true; _readoutDirty = true;
});
renderer.domElement.addEventListener('pointerleave', () => {
  _pointerInside = false; _readoutDirty = false;
  readout.style.display = 'none';
});
// Kamerabewegung ändert, was unter dem Zeiger liegt — aber nur, solange er drin ist.
function onControlsChange() { if (_pointerInside) _readoutDirty = true; }
/* =====================================================================
 *  Elektrogramm eines Mapping-Punktes
 *
 *  Ein CARTO-Export legt pro Punkt eine eigene Signaldatei an, rund 1,9 MB.
 *  Deshalb wird hier nichts vorgehalten: der Klick löst das Lesen aus, und
 *  gelesen wird genau eine Datei.
 * ===================================================================== */
const egmBox = document.getElementById('egm');
const egmTitle = document.getElementById('egm-title');
const egmMeta = document.getElementById('egm-meta');
const egmTraces = document.getElementById('egm-traces');
const egmChans = document.getElementById('egm-chans');

// Welche Kanäle gezeigt werden, über Punkte hinweg. Wer einen Kanal gewählt
// hat, will ihn am nächsten Punkt wiedersehen und nicht erneut suchen.
let egmChosen = null;

// Was gezeigt wird: der bipolare Mapping-Kanal, sein unipolarer Partner und
// eine Oberflächenableitung als Zeitbezug. Mehr als drei Kurven in einem
// Panel dieser Größe liest niemand.
const EGM_PREFERRED = ['M1-M2', 'M1', 'I', 'II'];
const EGM_MAX_TRACES = 3;

function hideEgm() {
  egmBox.style.display = 'none';
  egmTraces.innerHTML = '';
  egmChans.innerHTML = '';
}
document.getElementById('egm-close').onclick = hideEgm;

function egmChannels(egm) {
  // Eine getroffene Wahl gilt weiter, solange die Kanäle sie hergeben.
  if (egmChosen) {
    const kept = egmChosen.filter(n => egm.channels.includes(n));
    if (kept.length) return kept;
  }
  const chosen = EGM_PREFERRED.filter(n => egm.channels.includes(n));
  // Nennt der Kopf andere Kanäle, nimm die ersten — eine leere Anzeige wäre
  // schlechter als eine mit unerwarteten Namen.
  if (!chosen.length) return egm.channels.slice(0, EGM_MAX_TRACES);
  return chosen.slice(0, EGM_MAX_TRACES);
}

/* Die Kanalauswahl. Ein CARTO-Punkt trägt 26 Kanäle und drei davon zu zeigen
 * ist eine Vorauswahl, keine Beschränkung — wer die vierte Ableitung sehen
 * will, soll sie sehen können, ohne die Datei woanders zu öffnen. */
function buildChannelChips(egm, point) {
  egmChans.innerHTML = '';
  if (!egm || egm.channels.length < 2) return;
  const showing = new Set(egmChannels(egm));
  for (const name of egm.channels) {
    const chip = document.createElement('button');
    chip.textContent = name;
    chip.className = showing.has(name) ? 'on' : '';
    chip.onclick = () => {
      const next = new Set(egmChannels(egm));
      if (next.has(name)) next.delete(name); else next.add(name);
      // Nicht auf null zurückfallen: ein Panel ohne Kurve sieht aus wie ein
      // Punkt ohne Signal, und das ist etwas anderes.
      if (!next.size) return;
      egmChosen = egm.channels.filter(c => next.has(c));
      drawTraces(egm);
      buildChannelChips(egm, point);
    };
    egmChans.appendChild(chip);
  }
}

function drawTraces(egm) {
  egmTraces.innerHTML = '';
  for (const name of egmChannels(egm)) {
    const idx = egm.channels.indexOf(name);
    const data = egm.samples[idx];
    let lo = Infinity, hi = -Infinity;
    for (const v of data) { if (v < lo) lo = v; if (v > hi) hi = v; }
    const ptp = ((hi - lo) * egm.gainMv).toFixed(3);
    const row = document.createElement('div');
    row.className = 'trace';
    row.innerHTML = `<div class="lbl"><span>${name}</span><span>${ptp} mV</span></div>`
                  + traceSvg(data, egm.gainMv);
    egmTraces.appendChild(row);
  }
}

function traceSvg(samples, gainMv) {
  const n = samples.length;
  if (!n) return '<svg viewBox="0 0 100 46"></svg>';
  const W = 400, H = 46, pad = 3;
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < n; i++) { const v = samples[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
  // Eine flache Spur ist eine Aussage; sie auf volle Höhe zu spreizen wäre
  // eine erfundene.
  const span = (hi - lo) || 1;
  const step = Math.max(1, Math.floor(n / W));
  const pts = [];
  for (let i = 0; i < n; i += step) {
    const x = (i / (n - 1)) * W;
    const y = pad + (1 - (samples[i] - lo) / span) * (H - 2 * pad);
    pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`
       + `<polyline points="${pts.join(' ')}" fill="none" `
       + `stroke="var(--accent)" stroke-width="1" vector-effect="non-scaling-stroke"/>`
       + `</svg>`;
}

async function showEgm(point, readEgm) {
  // Rhythmia liest ein Fenster aus einem mehrere Gigabyte großen Archiv und
  // antwortet deshalb mit einem Promise; CARTO und EnSite haben ihre Datei
  // schon. Beides wird hier abgewartet, damit der Aufrufer den Unterschied
  // nicht kennen muss.
  egmTitle.textContent = `Punkt ${point.id ?? point.label ?? '—'}`;
  egmTraces.innerHTML = '';
  egmMeta.textContent = 'Lade Signal…';
  egmBox.style.display = 'block';

  let egm = null, failure = null;
  try { egm = readEgm ? await readEgm(point) : null; }
  catch (err) { failure = err.message || String(err); }

  const bits = [];
  if (point.bipolarMv != null) bits.push(`bipolar ${point.bipolarMv} mV`);
  if (point.unipolarMv != null) bits.push(`unipolar ${point.unipolarMv} mV`);
  if (point.peakNegativeMv != null) bits.push(`peak neg ${point.peakNegativeMv} mV`);
  if (point.woiMs) bits.push(`WOI ${point.woiMs[0]}…${point.woiMs[1]} ms`);
  if (point.cycleLengthMs != null) bits.push(`CL ${point.cycleLengthMs} ms`);
  let meta = bits.join(' · ') || 'keine Messwerte im Export';

  if (failure) {
    meta += `<br><span class="warn">Signal nicht lesbar: ${failure}</span>`;
  } else if (!egm) {
    meta += '<br><span class="warn">Dieser Punkt trägt kein Elektrogramm.</span>';
  } else {
    const seconds = egm.samples[0].length / egm.sampleRateHz;
    meta += `<br>${egm.channels.length} Kanäle · ${seconds.toFixed(2)} s`;
    // Die Rate steht nicht in der Datei. Das gehört auf den Schirm, nicht in
    // einen Kommentar: eine Zeitachse, die auf einer Annahme beruht, sieht
    // aus wie eine gemessene.
    if (egm.rateAssumed) {
      meta += ` · <span class="warn">${egm.sampleRateHz} Hz angenommen</span>`;
    } else {
      meta += ` · ${egm.sampleRateHz} Hz`;
    }
    // Rhythmia legt kein Signal je Punkt ab, sondern durchgehende Aufnahmen je
    // Katheter. Was hier steht, ist ein Fenster um den Zeitpunkt des Punktes —
    // und das gehört dazugesagt, sonst liest es sich wie seine eigene Messung.
    if (egm.window) {
      meta += '<br>Fenster aus der laufenden Aufzeichnung um den Zeitpunkt '
            + 'dieses Punktes, nicht seine eigene Messung.';
    }
    drawTraces(egm);
    buildChannelChips(egm, point);
  }
  egmMeta.innerHTML = meta;
  egmBox.style.display = 'block';
}

// Klick auf einen Marker. Dieselben Objekte, die `tagHover` prüft — was
// angezeigt wird, ist damit auch das, was getroffen wird.
renderer.domElement.addEventListener('click', (e) => {
  if (!tagMeshes.length) return;
  ptr.x = (e.clientX / innerWidth) * 2 - 1;
  ptr.y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  const objs = tagMeshes.filter(t => t.inst.visible).map(t => t.inst);
  if (!objs.length) return;
  const hit = ray.intersectObjects(objs, false)[0];
  if (!hit || hit.instanceId == null) return;
  const g = hit.object.userData.group;
  const marker = g && g.points && g.points[hit.instanceId];
  if (!marker || !marker.egm) return;      // ein Tag ohne Signal bleibt ein Tag
  showEgm(marker.egm, current && current.readEgm)
    .catch(err => console.error('[epview] Elektrogramm:', err));
});

// Raycast tag markers first; on hit show "<point label> · <group label>" in the readout.
function tagHover() {
  if (!tagMeshes.length) return false;
  ray.setFromCamera(ptr, camera);
  const objs = tagMeshes.filter(t => t.inst.visible).map(t => t.inst);
  if (!objs.length) return false;
  const hit = ray.intersectObjects(objs, false)[0];
  if (!hit) return false;
  const g = hit.object.userData.group;
  const pt = g.points[hit.instanceId];
  // labels come from a loaded file (untrusted) -> build with safe DOM, not innerHTML
  readout.textContent = '';
  const b = document.createElement('b'); b.textContent = (pt && pt.label) || '';
  readout.appendChild(b);
  readout.appendChild(document.createTextNode(' · ' + g.label));
  readout.style.display = 'block';
  readout.style.left = hoverX + 'px';
  readout.style.top = hoverY + 'px';
  return true;
}
function updateReadout() {
  if (tagHover()) return;
  if (!mesh || !state.mode || !state.mode.startsWith('scalar:')) { readout.style.display = 'none'; return; }
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObject(mesh, false)[0];
  if (!hit) { readout.style.display = 'none'; return; }
  const field = state.mode.slice(7);
  const s = visibleScalar(field);          // Wert passend zur Farbe unter dem Cursor
  const rawS = current.scalars[field];
  // nearest of the three face vertices (in Mesh-lokalen Koordinaten – das Mesh
  // sitzt in einer verschobenen Group, daher hit.point nach lokal umrechnen)
  const f = hit.face;
  const pos = mesh.geometry.getAttribute('position');
  const p = mesh.worldToLocal(hit.point.clone());
  let best = f.a, bd = Infinity;
  for (const vi of [f.a, f.b, f.c]) {
    const dx = pos.getX(vi)-p.x, dy = pos.getY(vi)-p.y, dz = pos.getZ(vi)-p.z;
    const d = dx*dx+dy*dy+dz*dz; if (d < bd) { bd = d; best = vi; }
  }
  const v = s[best], raw = rawS[best];
  const meta = FIELD_META[field.toLowerCase()] || { unit: state.unit };
  // Der angezeigte Wert gehört zur Farbe; der Rohwert steht daneben, sobald
  // Glättung oder Conf-Maske ihn verändern.
  const showsRaw = !Number.isNaN(raw) && (Number.isNaN(v) || Math.abs(raw - v) > 1e-9);
  readout.innerHTML = Number.isNaN(v)
    ? (showsRaw ? `<b>—</b> unmapped (roh ${round(raw)})` : '<b>—</b> unmapped')
    : `<b>${round(v)}</b> ${meta.unit || ''}` + (showsRaw ? ` <small>(roh ${round(raw)})</small>` : '');
  readout.style.display = 'block';
  readout.style.left = hoverX + 'px';
  readout.style.top = hoverY + 'px';
}

 * ===================================================================== */
let rawMeshes = [];   // mehrere Anatomien/Surfaces aus einem Rohexport

const loadingEl = document.getElementById('loading');
const loadingTextEl = document.getElementById('loading-text');
function showLoading(t) { loadingTextEl.textContent = t || 'Lade…'; loadingEl.classList.add('show'); }
function setLoading(t) { loadingTextEl.textContent = t; }
function hideLoading() { loadingEl.classList.remove('show'); }
const mb = (b) => (b / 1048576).toFixed(0);
function rawProgress(p) {
  if (p.phase === 'scan') setLoading(`Archiv scannen…  ${mb(p.done)} / ${mb(p.total)} MB`);
  else if (p.phase === 'build') setLoading('Mesh & Skalare lesen…');
}

// Fertiges Mesh (PLY/OBJ/STL)
async function loadMeshFile(file) {
  const name = file.name.toLowerCase();
  let data;
  if (name.endsWith('.ply')) data = EP.parsePLY(await file.arrayBuffer());
  else if (name.endsWith('.obj')) data = EP.parseOBJ(await file.text());
  else if (name.endsWith('.stl')) data = EP.parseSTL(await file.arrayBuffer());
  else throw new Error('Format nicht unterstützt: ' + name);
  if (!data.positions.length) throw new Error('Keine Geometrie gefunden.');
  loadGeometry(data, file.name);
}

// epconv-Mesh -> loadGeometry-Datenform
function loadParsedMesh(m) {
  loadGeometry({
    positions: m.positions, normals: m.normals || null, colors: null,
    scalars: m.scalars || {}, scalarNames: Object.keys(m.scalars || {}),
    faces: m.faces, tagGroups: m.tagGroups || null, source: m.source || null,
    // Named, like everything else here: the field list is deliberate, so a
    // parser that starts returning something new has to say so. `readEgm` is
    // the closure that reads one point's signal on demand — dropping it left
    // every mapping point reporting that it had no electrogram.
    points: m.points || null, readEgm: m.readEgm || null,
    ablation: m.ablation || null, ablationNote: m.ablationNote || null,
  }, m.name || 'Mesh');
}

/* Was in einem geöffneten Ordner steckt, und welche Studie daraus wird.
 *
 * Wer den Ordner mit allen Exporten öffnet — `3D/` mit `Rhythmia/`, `Carto/`
 * und `Ensite/` darin — bekam bisher alle Dateien auf einmal an den Leser:
 * eine einzige `.000` irgendwo machte daraus eine Rhythmia-Studie, zusammen-
 * gesetzt aus den Teilen dreier Untersuchungen. Also erst gruppieren, dann
 * fragen, dann lesen.
 */
/** Öffnen, was unter diesem Pfad liegt — Ordner oder Datei.
 *
 * Der Pfad kommt aus einem nativen Dialog; gelesen wird über die Anwendung
 * (shared/bridge.js), weil eine Seite keine Datei von der Platte aufmachen
 * kann. Ohne Backend gibt es hier nichts zu tun — dort gibt es auch keinen
 * nativen Dialog, also fragt niemand danach.
 */
async function openPath(path) {
  showLoading('Lade…');
  try {
    const listing = await window.epcore.localFiles(path);
    if (!listing || !listing.files || !listing.files.length) {
      alert(T('map.msg.nostudies'));
      return;
    }
    studyName = String(listing.root || path).replace(/^.*[\\/]/, '');
    await openFileList(listing.files.map(
      entry => window.epcore.localFile(listing.root, entry)));
  } catch (err) {
    alert(T('map.msg.load.failed') + '\n' + err.message);
  } finally {
    hideLoading();
  }
}

async function openFileList(fileList) {
  const files = Array.from(fileList);
  if (!files.length) return;

  // Einzeln gewählte Dateien tragen keinen Pfad — dann hat der Nutzer die
  // Auswahl schon getroffen und es gibt nichts zu fragen.
  const picked = files.some(f => f.webkitRelativePath);
  if (!picked) {
    // Einzeln gewählte Dateien: der Name der ersten ist das Beste, was es gibt.
    studyName = files.length === 1 ? files[0].name : '';
    await loadFiles(files);
    return;
  }

  const studies = EP.groupStudies(files);
  const readable = studies.filter(s => s.readable);

  if (!studies.length) {
    alert(T('map.msg.nostudies'));
    return;
  }
  if (!readable.length) {
    // Gefunden und hier nicht lesbar ist etwas anderes als nicht gefunden.
    alert(T('map.msg.onlyapp', { name: studies[0].label }));
    return;
  }
  if (readable.length === 1) { studyName = readable[0].label; await loadFiles(readable[0].files); return; }
  askWhichStudy(readable);
}

/** Mehrere Studien im Ordner: fragen, nicht raten. */
function askWhichStudy(studies) {
  const box = document.getElementById('studypick');
  const list = document.getElementById('studypick-list');
  list.textContent = '';
  for (const study of studies) {
    const row = document.createElement('button');
    row.className = 'tool';
    row.textContent = study.label;
    const sub = document.createElement('span');
    sub.className = 'sub';
    sub.textContent = `${study.kind} · ${study.files.length}`;
    row.appendChild(sub);
    row.onclick = () => { box.classList.remove('show'); studyName = study.label; loadFiles(study.files); };
    list.appendChild(row);
  }
  box.classList.add('show');
}

async function loadFiles(fileList) {
  const files = Array.from(fileList);
  if (!files.length) return;
  showLoading('Lade…');
  try {
    // Einzelnes fertiges Mesh?
    if (files.length === 1 && /\.(ply|obj|stl)$/i.test(files[0].name)) {
      rawMeshes = []; populateMeshSelector([]);
      await loadMeshFile(files[0]);
      return;
    }
    // Rohexport (Rhythmia .000/.001…, CARTO .zip, EnSite .xml)
    let unzip = null;
    if (files.some(f => f.name.toLowerCase().endsWith('.zip'))) {
      setLoading('ZIP entpacken…');
      ({ unzipSync: unzip } = await import('../vendor/fflate.module.js?v=76e45eb3ef80'));
    }
    setLoading('Konvertiere…');
    // dem Browser einen Frame geben, damit der Spinner sichtbar wird
    await new Promise(r => requestAnimationFrame(() => r()));
    const meshes = await EP.loadRawFiles(files, unzip, rawProgress);
    if (!meshes.length) throw new Error('Keine Mesh-Daten im Export gefunden.');
    rawMeshes = meshes;
    populateMeshSelector(meshes);
    loadParsedMesh(meshes[0]);
  } catch (err) {
    alert(T('map.msg.load.failed') + '\n' + err.message);
    console.error(err);
  } finally {
    hideLoading();
  }
}

function populateMeshSelector(meshes) {
  const grp = document.getElementById('grp-mesh');
  const sel = document.getElementById('meshsel');
  if (!meshes || meshes.length < 2) { grp.style.display = 'none'; return; }
  sel.innerHTML = '';
  meshes.forEach((m, i) => { const o = document.createElement('option'); o.value = i; o.textContent = m.name || ('Mesh ' + i); sel.appendChild(o); });
  sel.value = '0';
  grp.style.display = '';
}

/* ---------- Export (PLY / OBJ / STL Download) ---------- */
function bakeColorsU8() {
  if (!current) return null;
  const n = current.positions.length / 3;
  if (state.mode === 'vertex' && current.colors) return current.colors;
  if (state.mode && state.mode.startsWith('scalar:')) {
    // Wie applyColors(): geglättet, Conf-Maske und Scar-Isolation eingerechnet.
    // Sonst sieht ein exportiertes oder geteiltes Modell anders aus als das,
    // was der Nutzer beim Klicken auf dem Schirm hatte.
    const s = visibleScalar(state.mode.slice(7));
    const table = lut(state.cmap), span = (state.vmax - state.vmin) || 1e-9;
    const out = new Uint8Array(n * 3);
    for (let i = 0; i < n; i++) {
      const v = s[i];
      if (Number.isNaN(v)) { out[i*3]=UNMAPPED[0]; out[i*3+1]=UNMAPPED[1]; out[i*3+2]=UNMAPPED[2]; continue; }
      if (state.isolateScar && v >= state.vmin) { out[i*3]=26; out[i*3+1]=26; out[i*3+2]=26; continue; }
      let t = (v - state.vmin) / span; t = t < 0 ? 0 : t > 1 ? 1 : t;
      const idx = (t * 255) | 0;
      out[i*3]=table[idx*3]; out[i*3+1]=table[idx*3+1]; out[i*3+2]=table[idx*3+2];
    }
    return out;
  }
  return null;
}
async function download(name, data, mime) {
  // Über den gemeinsamen Speicherpfad: in der Desktop-Hülle lädt `<a download>`
  // nicht herunter, sondern navigiert zur URL — und ersetzt damit die Anwendung
  // durch die Datei, ohne Weg zurück.
  const r = await EPSave.saveBytes(name, new Blob([data], { type: mime }));
  if (!r.ok && !r.cancelled) console.warn('[epview] Speichern:', r.error);
  return r;
}
async function exportMesh(fmt) {
  if (!current) { alert(T('map.msg.load.first')); return; }
  const m = { positions: current.positions, normals: current.normals || null, faces: current.faces, scalars: current.scalars || {} };
  const base = (currentName || 'epview').replace(/\.[^.]+$/, '').replace(/[^\w\-.]/g, '_');
  // Binäres PLY ist Default (P-8): 43x schneller zu schreiben, rund halb so
  // groß, und der eigene Parser liest es. ASCII bleibt als Menüpunkt, falls
  // ein Empfängerwerkzeug es braucht.
  if (fmt === 'ply') download(base + '.ply', EP.exportPLYBinary(m, bakeColorsU8()), 'application/octet-stream');
  else if (fmt === 'ply-ascii') download(base + '.ply', EP.exportPLY(m, bakeColorsU8()), 'text/plain');
  else if (fmt === 'obj') download(base + '.obj', EP.exportOBJ(m, bakeColorsU8()), 'text/plain');
  else if (fmt === 'stl') download(base + '.stl', EP.exportSTL(m), 'application/octet-stream');
  else if (fmt === 'openep') {
    // Die Oberfläche mit ihren Messwerten im OpenEP-Format, damit sie dort
    // ausgewertet werden kann. Mapping-Punkte und Elektrogramme reisen nicht
    // mit — eine umgewandelte Karte hat sie nicht, und die Datei sagt das in
    // ihrem `notes`-Feld selbst.
    const sc = m.scalars || {};
    // Punkte und Kurven reisen mit, wenn die Karte aus einem Rohexport kam.
    // Die Kurven werden hier gelesen — beim Export will man sie alle, anders
    // als beim Klicken, wo genau eine gefragt ist.
    let points = null, curves = null, names = null;
    if (current.points && current.points.length && current.readEgm) {
      points = current.points.filter(p => p.xyz);
      curves = []; names = [];
      for (const p of points) {
        let egm = null;
        try { egm = await current.readEgm(p); } catch (e) { egm = null; }
        curves.push(egm ? egm.samples[0] : null);
        names.push(egm ? `${p.id ?? p.label ?? ''} ${egm.channels[0]}`
                       : String(p.id ?? p.label ?? ''));
      }
    }
    download(base + '.mat',
             EPO.buildOpenEP(m.positions, m.faces, {
               activation: sc.lat, bipolar: sc.voltage, unipolar: sc.unipolar,
               impedance: sc.impedance, force: sc.force, name: base,
               points, curves, pointNames: names }),
             'application/octet-stream');
  }
}

/* =====================================================================
 *  Share — upload the baked PLY (with scrubbed tags) to the configured
 *  backend; show link + QR + revoke. Backend URL + token live only in
 *  this browser's localStorage (your own server secret).
 * ===================================================================== */
let _shareDel = null;  // { url, id, token } for revoke

function shareConfig({ silent = false } = {}) {
  /* Same origin by default. On epcore.app the service answers under /maps on
   * this very host, so asking the user for an address they have no way of
   * knowing would be the page making its own deployment their problem. A
   * stored value still wins, for anyone pointing the viewer at their own
   * backend. Whether anything actually answers there is a separate question —
   * see shareBackendAvailable, because this page is published in more than one
   * place and only one of them has the service. */
  let url = localStorage.getItem('epview_share_url') || '';
  if (!url && /^https?:$/.test(location.protocol)) url = location.origin;
  if (!url && silent) return { url: '', tok: '' };
  if (!url) { url = (prompt('Backend-Basis-URL (z.B. https://maps.example.org):') || '').trim().replace(/\/+$/, ''); if (url) localStorage.setItem('epview_share_url', url); }
  /* No token prompt here. Uploads are open on epcore.app, so the box would ask
   * for a secret that does not exist — and it used to ask before the token was
   * ever sent anywhere, which meant a stored token and a 401 side by side. The
   * server says when it wants one; see the 401 branch below. */
  return { url, tok: localStorage.getItem('epview_share_token') || '' };
}
function showShareBox() { document.getElementById('sharebox').classList.add('show'); }
function hideShareBox() { document.getElementById('sharebox').classList.remove('show'); }
function shareError(msg) {
  document.getElementById('share-busy').style.display = 'none';
  const e = document.getElementById('share-err'); e.style.display = ''; e.textContent = msg;
}

/* Set once the tag labels have been scrubbed. The server refuses what it can
 * recognise, but it cannot prove a mesh is anonymous — so a map nobody has
 * scrubbed does not get offered a public URL in the first place. */
let _anonymised = false;

/* Does a share service answer on this origin? null until asked.
 *
 * This page is published in three places and only one of them has the service:
 * epcore.app does, the GitHub Pages copy does not, and neither does the desktop
 * application. Defaulting the endpoint to the page's own origin is right for
 * the first and points at nothing for the other two — the button POSTed to
 * cara.github.io/maps and came back 405, which reads as "sharing is broken"
 * rather than "sharing is not part of this copy".
 *
 * So it asks, once, and only when someone has actually anonymised a map. A
 * button that cannot work should not be offered. */
let _shareBackend = null;

async function shareBackendAvailable() {
  if (_shareBackend !== null) return _shareBackend;
  const { url } = shareConfig({ silent: true });
  if (!url) { _shareBackend = false; return false; }
  try {
    /* A deliberately malformed id. The share service rejects the *shape*
     * before it touches the filesystem and says so as {"error": …}; that
     * field is how every refusal in it is written, so it identifies the
     * service rather than merely the media type.
     *
     * "It answered JSON" is not enough and was wrong when first written: the
     * application's own backend serves this page too, and FastAPI's 404 is
     * {"detail": "Not Found"} — JSON, from something that cannot store a map.
     * A static host answers with HTML and fails the parse. */
    const res = await fetch(url + '/maps/x', { method: 'GET' });
    const body = await res.json();
    _shareBackend = typeof body?.error === 'string';
  } catch {
    _shareBackend = false;              // HTML, blocked by CORS, offline, no route
  }
  return _shareBackend;
}

/* Warum Teilen gerade nicht geht — als Zustand am Knopf, nicht als toter Knopf.
 * `.blocked` sagt es dem Auge, der Titel der Vorlesehilfe, und der Klick sagt
 * es in Worten. `disabled` sagte es nur dem Mauszeiger: wer trotzdem klickte,
 * bekam gar nichts — und las das als kaputte Anwendung. Auch kein
 * `aria-disabled`, denn der Knopf ist nicht abgeschaltet, er erklärt sich. */
async function markAnonymised(yes) {
  _anonymised = !!yes;
  const button = document.getElementById('t-share');
  if (!button) return;
  const block = (why) => {
    button.classList.add('blocked');
    button.title = why;
  };
  if (!_anonymised) {
    block('Erst anonymisieren — geteilte Karten bekommen eine öffentliche Adresse.');
    return;
  }
  if (!await shareBackendAvailable()) {
    block('Diese Ausgabe hat keinen Teilen-Dienst. Zum Teilen die Karte auf '
        + 'https://epcore.app/epview/ öffnen.');
    return;
  }
  button.classList.remove('blocked');
  button.title = '';
}

async function doShare() {
  if (!current) { alert(T('map.msg.load.first')); return; }
  if (!_anonymised) {
    alert('Diese Karte wurde nicht anonymisiert. Geteilte Karten bekommen eine '
        + 'öffentliche Adresse — erst anonymisieren, dann teilen.');
    return;
  }
  if (!(await shareBackendAvailable())) {
    alert('Diese Ausgabe des Kartenviewers hat keinen Teilen-Dienst.\n\n'
        + 'Zum Teilen dieselbe Karte auf https://epcore.app/epview/ öffnen.');
    return;
  }
  const { url, tok } = shareConfig();
  if (!url) { alert('Keine Adresse für den Teilen-Dienst hinterlegt.'); return; }
  document.getElementById('share-result').style.display = 'none';
  document.getElementById('share-err').style.display = 'none';
  document.getElementById('share-busy').style.display = '';
  showShareBox();
  try {
    const m = { positions: current.positions, normals: current.normals || null, faces: current.faces, scalars: current.scalars || {} };
    // binäres PLY (P-8): halbes Upload-Volumen, und das Schreiben blockiert die
    // Oberfläche nicht mehr sekundenlang.
    const ply = EP.exportPLYBinary(m, bakeColorsU8(), current.tagGroups && current.tagGroups.length ? [encodeTagComment(current.tagGroups)] : []);
    const headers = {
      'Content-Type': 'application/octet-stream',
      // What the server records rather than verifies. It says who claimed
      // the map was scrubbed; it does not pretend to have checked.
      'X-EPCore-Anonymised': 'yes',
    };
    if (tok) headers.Authorization = 'Bearer ' + tok;
    let res = await fetch(url + '/maps', { method: 'POST', headers, body: ply });
    // A backend with EPVIEW_TOKEN set wants one. Ask when it asks — the token
    // used to be collected up front and then not sent, so a self-hosted
    // instance answered 401 to someone who had already typed the right secret.
    if (res.status === 401) {
      const asked = (prompt('Upload-Token (EPVIEW_TOKEN):') || '').trim();
      if (asked) {
        localStorage.setItem('epview_share_token', asked);
        headers.Authorization = 'Bearer ' + asked;
        res = await fetch(url + '/maps', { method: 'POST', headers, body: ply });
      }
    }
    if (!res.ok) {
      let detail = 'HTTP ' + res.status;
      try {
        const body = await res.json();
        if (body && body.detail) detail = body.detail;
      } catch {
        /* Not JSON means the answer did not come from the share service — a
         * proxy in front turned the request away first. 413 is the one that
         * actually happens: nginx defaults to a 1 MB body and maps are
         * several, so every real share fails while the service's own limit
         * (25 MB) looks perfectly generous. Say which server said no. */
        if (res.status === 413) {
          detail = `Die Karte (${(ply.byteLength / 1048576).toFixed(1)} MB) wurde von `
                 + 'einem vorgelagerten Server abgewiesen, nicht vom Teilen-Dienst. '
                 + 'Dort ist die maximale Upload-Größe zu klein eingestellt '
                 + '(siehe docs/DEPLOY.md, client_max_body_size).';
        }
      }
      shareError(T('map.msg.upload.failed') + ' ' + detail);
      return;
    }
    const body = await res.json();
    const { id, delete_token } = body;
    // The address people paste. It stays valid if the viewer moves, which
    // ?src=<url> did not.
    const link = body.url || `${location.origin}/view/${id}`;
    _shareDel = { url, id, token: delete_token };
    document.getElementById('share-link').value = link;
    document.getElementById('share-id').textContent = id;
    document.getElementById('share-busy').style.display = 'none';
    document.getElementById('share-result').style.display = '';
    try {
      const { default: qrcode } = await import('../vendor/qrcode-generator.js?v=76e45eb3ef80');
      const qr = qrcode(0, 'M'); qr.addData(link); qr.make();
      document.getElementById('share-qr').src = qr.createDataURL(6, 8);
    } catch { document.getElementById('share-qr').style.display = 'none'; }
  } catch (err) { shareError(T('map.msg.error') + ' ' + err.message); }
}

async function doRevoke() {
  if (!_shareDel) return;
  const { url, id, token } = _shareDel;
  try {
    const res = await fetch(`${url}/maps/${id}`, { method: 'DELETE', headers: { 'X-Delete-Token': token } });
    if (res.ok) shareError(T('map.msg.revoked'));
    else shareError(T('map.msg.revoke.failed') + ' HTTP ' + res.status);
  } catch (err) { shareError(T('map.msg.revoke.failed') + ' ' + err.message); }
}

/* =====================================================================
 *  Video export — MediaRecorder on a compositing 2D canvas.
 *  mp4 when the browser supports it (zero deps), else webm.
 * ===================================================================== */
function pickMime() {
  const types = ['video/mp4;codecs=avc1.640028', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  if (!window.MediaRecorder) return null;
  for (const t of types) { if (MediaRecorder.isTypeSupported(t)) return t; }
  return null;
}
function mimeExt(mime) { return mime.includes('mp4') ? 'mp4' : 'webm'; }

let recCanvas = null, recCtx = null;
function ensureRecCanvas() {
  const gl = renderer.domElement;
  if (!recCanvas) { recCanvas = document.createElement('canvas'); recCtx = recCanvas.getContext('2d'); }
  if (recCanvas.width !== gl.width || recCanvas.height !== gl.height) { recCanvas.width = gl.width; recCanvas.height = gl.height; }
}
// Copy the GL frame onto the 2D canvas + optionally bake the colorbar legend.
function compositeFrame() {
  ensureRecCanvas();
  const W = recCanvas.width, H = recCanvas.height;
  // GL canvas is alpha:true; an opaque fill stops previous-frame bleed-through.
  // From the token, so a recording made in the light theme is not a bright map
  // on a black rectangle.
  recCtx.fillStyle = themeToken('--bg-0') || '#05080b';
  recCtx.fillRect(0, 0, W, H);
  recCtx.drawImage(renderer.domElement, 0, 0, W, H);
  if (recOpts.bakeLegend && state.mode && state.mode.startsWith('scalar:')) drawLegendOverlay(recCtx, W, H);
}
/** Die Karte allein, für den Schnappschuss.
 *
 *  Ohne Orientierungswürfel und ohne eingebrannte Farbskala: beides steht im
 *  Fenster neben dem Bild und gehört nicht in eine Datei, die in einen Bericht
 *  wandert. Der Hintergrund ist standardmäßig durchsichtig — so lässt sich das
 *  Bild auf jede Folie legen; wer einen festen Grund will, stellt ihn in den
 *  Einstellungen ein.
 */
function snapshotBackground() {
  const setting = window.epcoreSettings && window.epcoreSettings.get('snapshotBackground');
  if (!setting || setting === 'transparent') return null;
  if (setting === 'theme') return themeToken('--bg-0') || '#05080b';
  return setting;                       // eine Farbe, wie eingestellt
}

function snapshotCanvas() {
  ensureRecCanvas();
  const W = recCanvas.width, H = recCanvas.height;
  recCtx.clearRect(0, 0, W, H);
  const background = snapshotBackground();
  if (background) { recCtx.fillStyle = background; recCtx.fillRect(0, 0, W, H); }
  recCtx.drawImage(renderer.domElement, 0, 0, W, H);
  return recCanvas;
}

function drawLegendOverlay(ctx, W, H) {
  const table = lut(state.cmap);
  const barH = Math.round(H * 0.34), barW = Math.max(10, Math.round(W * 0.012));
  const x = W - barW - Math.round(W * 0.06), y = Math.round(H * 0.30);
  for (let i = 0; i < barH; i++) {
    const t = 1 - i / (barH - 1); const idx = (t * 255) | 0;
    ctx.fillStyle = `rgb(${table[idx*3]},${table[idx*3+1]},${table[idx*3+2]})`;
    ctx.fillRect(x, y + i, barW, 1);
  }
  const fs = Math.max(11, Math.round(H * 0.016));
  ctx.font = `${fs}px monospace`; ctx.fillStyle = themeToken('--text') || '#d8e6ec'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  for (let k = 0; k <= 4; k++) {
    const val = state.vmin + (state.vmax - state.vmin) * (1 - k / 4);
    ctx.fillText(round(val), x + barW + 6, y + (barH * k / 4));
  }
  const field = state.mode.slice(7);
  const meta = FIELD_META[field.toLowerCase()] || { label: field, unit: state.unit };
  ctx.fillText((meta.label || field) + (meta.unit ? ' · ' + meta.unit : ''), x - Math.round(W * 0.02), y + barH + fs * 1.5);
}

function recIndicator(on) {
  document.getElementById('rec-dot').classList.toggle('on', on);
  document.getElementById('t-rec').classList.toggle('on', on);
}

/** Aufnehmen, bis jemand aufhört. */
function toggleFreeRecording() {
  if (state.recording) { stopRecording(); return; }
  if (!mesh) { alert(T('map.msg.load.first')); return; }
  // Kein `durationMs`, das die Schleife erreichen könnte: diese Aufnahme endet,
  // wenn der Nutzer sie beendet, nicht nach einer Zahl aus den Einstellungen.
  startRecording({ mode: 'live', kind: 'free', durationMs: Infinity, label: 'view' });
}
function setRecButtonsDisabled(d) {
  for (const id of ['t-orbit', 't-export']) document.getElementById(id).style.opacity = d ? '0.5' : '';
}

// spec: { mode:'driver'|'live', kind, driver?, durationMs, label }
function startRecording(spec) {
  if (!mesh) { alert(T('map.msg.load.first')); return; }
  if (state.recording) return;
  const mime = pickMime();
  if (!mime) { alert(T('map.msg.norecorder')); return; }
  const savedAnim = { t: state.anim.t, engaged: state.anim.engaged };  // capture BEFORE priming (driver(0) may move the cursor)
  // prime the first frame so capture doesn't start blank
  renderer.setScissorTest(false); renderer.setViewport(0, 0, innerWidth, innerHeight);
  if (spec.mode === 'driver' && spec.driver) spec.driver(0);
  renderer.render(scene, camera);
  ensureRecCanvas();
  compositeFrame();
  let recorder;
  try { recorder = new MediaRecorder(recCanvas.captureStream(recOpts.fps), { mimeType: mime, videoBitsPerSecond: 12_000_000 }); }
  catch (e) { alert('Recorder-Fehler: ' + e.message); return; }
  const chunks = [];
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => download(`epview-${spec.label}.${mimeExt(mime)}`, new Blob(chunks, { type: mime }), mime);
  recorder.onerror = ev => { alert(T('map.msg.rec.error') + ' ' + (ev.error?.message || ev.error)); finishRecording(); };
  state.recording = { ...spec, start: null, recorder, savedAnim };
  recorder.start();
  recIndicator(true);
  setRecButtonsDisabled(true);
}
function stopRecording() {
  const rec = state.recording; if (!rec) return;
  if (rec.recorder && rec.recorder.state !== 'inactive') rec.recorder.stop();
  finishRecording();
}
function finishRecording() {
  const rec = state.recording; if (!rec) return;
  if (rec.kind === 'activation' && state.anim) { state.anim.t = rec.savedAnim.t; state.anim.engaged = rec.savedAnim.engaged; }
  state.recording = null;
  recIndicator(false);
  setRecButtonsDisabled(false);
  applyColors();
}

let _orbit = null;
function orbitFrame(progress) {
  const p = recOpts.ease ? ease(progress) : progress;
  const { az, pitch } = orbitPath(recOpts.path, p, _orbit.theta0, _orbit.basePitch);
  const cp = Math.cos(pitch), d = _orbit.d, c = _orbit.target;
  // Um den eingestellten Zielpunkt kreisen, nicht um den Ursprung — sonst
  // nimmt die Aufnahme nach einem Pan ein anderes Bild auf als eingestellt.
  camera.position.set(c.x + d * cp * Math.sin(az), c.y + d * Math.sin(pitch), c.z + d * cp * Math.cos(az));
  camera.up.set(0, 1, 0);
  camera.lookAt(c.x, c.y, c.z);
}
function startOrbit() {
  if (!mesh) { alert(T('map.msg.load.first')); return; }
  mesh.geometry.computeBoundingSphere();
  const r = mesh.geometry.boundingSphere.radius || 50;
  const target = controls.target.clone();
  const pos = camera.position.clone().sub(target);                     // relative to the actual orbit centre
  const d = Math.max(pos.length(), 1e-3);                              // current distance from target -> keep zoom
  const theta0 = Math.atan2(pos.x, pos.z);                             // current azimuth -> no horizontal snap
  const basePitch = Math.asin(Math.max(-1, Math.min(1, pos.y / d)));   // current elevation -> no vertical snap
  _orbit = { d, theta0, basePitch, target };
  camera.near = r / 100; camera.far = d * 8; camera.updateProjectionMatrix();   // generous clip planes (like setView)
  startRecording({ mode: 'driver', kind: 'orbit', driver: orbitFrame, durationMs: recOpts.orbitSeconds * 1000, label: 'orbit' });
}

function activationFrame(progress) {
  state.anim.t = activationCursor(progress, state.vmin, state.vmax, state.anim.mode, recOpts.cycles);
  applyColors();
}
function startExport() {
  if (!mesh) { alert(T('map.msg.load.first')); return; }
  const field = state.mode && state.mode.startsWith('scalar:') ? state.mode.slice(7) : null;
  if (field && isLatField(field)) {
    state.anim.engaged = true;
    const W = state.vmax - state.vmin;
    const oneCycle = Math.max(2, Math.round(W / (state.anim.speed || 60)));
    const cycles = state.anim.mode === 'loop' ? recOpts.cycles : 1;
    const seconds = recOpts.exportSeconds || (oneCycle * cycles);
    startRecording({ mode: 'driver', kind: 'activation', driver: activationFrame, durationMs: seconds * 1000, label: 'activation' });
  } else {
    startRecording({ mode: 'live', kind: 'live', durationMs: (recOpts.exportSeconds || 6) * 1000, label: 'view' });
  }
}

/* demo: synthetic LV-like ellipsoid with a voltage gradient + a low-voltage scar */
/* The demo map.
 *
 * It used to be a procedurally shaded ellipsoid — an egg with a synthetic
 * low-voltage patch. It showed that the renderer worked and nothing about what
 * the tool is for: real anatomy is not an ellipsoid, and a real voltage field
 * does not fall off smoothly from one point.
 *
 * This is a de-identified Rhythmia HDx export instead: 18137 vertices, 265 cm²,
 * with the bipolar voltage and the activation times the system recorded — so
 * the low-voltage areas are where the mapping system found them, not where a
 * formula put them. Nothing but geometry and measurements travels; see
 * demo/README.md for what was checked. */
async function loadDemo() {
  await loadURL(new URL('demo/rhythmia-voltage.ply', location.href).href);
}

function buildDemo() {
  const sp = new THREE.SphereGeometry(45, 96, 64);
  sp.scale(1, 1.35, 1);
  const pos = sp.getAttribute('position');
  const n = pos.count;
  const positions = new Float32Array(pos.array);
  const normals = new Float32Array(sp.getAttribute('normal').array);
  const voltage = new Float32Array(n);
  const lat = new Float32Array(n);
  const scar = new THREE.Vector3(20, -30, 30);
  for (let i = 0; i < n; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const d = Math.hypot(x-scar.x, y-scar.y, z-scar.z);
    let v = 0.08 + 0.55 * Math.min(1, d / 70);
    v += (Math.sin(x*0.18)+Math.cos(z*0.15)) * 0.03;
    voltage[i] = Math.max(0.02, v);
    lat[i] = 10 + (y + 60) * 0.7 + Math.sin(x*0.05)*8;
  }
  const idx = sp.getIndex().array;
  const RX = 45, RY = 45 * 1.35, RZ = 45;
  const onSurf = (theta, phi) => [RX * Math.sin(phi) * Math.cos(theta), RY * Math.cos(phi), RZ * Math.sin(phi) * Math.sin(theta)];
  const tagGroups = [
    { id: 'abl', label: 'Ablation', category: 'ablation', color: tagCategoryColor('ablation'), points: [] },
    { id: 'cs', label: 'CS', category: 'annotation', color: [255, 0, 255],
      points: [{ position: onSurf(2.4, 1.05), label: 'CS 1' }, { position: onSurf(2.7, 1.25), label: 'CS 2' }] },
  ];
  for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; tagGroups[0].points.push({ position: onSurf(a, 1.15 + 0.18 * Math.sin(a)), label: 'Abl ' + (i + 1) }); }
  loadGeometry({
    positions, normals, colors: null,
    scalars: { voltage, lat }, scalarNames: ['voltage', 'lat'],
    faces: new Uint32Array(idx), tagGroups,
  }, 'Demo');
}

/* Zwei Regler auf einer Bahn: der Zeiger trifft immer den oberen. Wer oben
 * liegt, richtet sich deshalb danach, welcher Griff näher am Zeiger ist —
 * sonst ist der eine Griff für immer unerreichbar, und genau das war der
 * linke: er ließ sich weder greifen noch ziehen. */
(() => {
  const box = document.getElementById('vwin');
  if (!box) return;
  const lo = document.getElementById('vmin-s'), hi = document.getElementById('vmax-s');
  const raiseNearerHandle = (event) => {
    const rect = box.getBoundingClientRect();
    if (!rect.width) return;
    const at = (event.clientX - rect.left) / rect.width;
    const where = (el) => (+el.value - +el.min) / ((+el.max - +el.min) || 1);
    const nearer = Math.abs(at - where(lo)) <= Math.abs(at - where(hi)) ? lo : hi;
    lo.style.zIndex = nearer === lo ? '2' : '1';
    hi.style.zIndex = nearer === hi ? '2' : '1';
  };
  // Vor dem Griff, nicht währenddessen: ein Wechsel mitten im Ziehen würde den
  // Regler unter dem Finger austauschen.
  box.addEventListener('pointermove', (e) => { if (e.buttons === 0) raiseNearerHandle(e); });
  box.addEventListener('pointerdown', raiseNearerHandle, true);
})();

// Q/E roll the view around the camera->target axis (rotate camera.up, then re-derive).
addEventListener('keydown', (e) => {
  // R nimmt auf und beendet. Frei, weil Q/E rollen und alles andere in der
  // Werkzeugleiste einen Knopf hat; mit Modifikator ist es der Neuladen-Befehl
  // des Browsers und gehört ihm.
  if (e.key.toLowerCase() === 'r' && !e.metaKey && !e.ctrlKey && !e.altKey) {
    const field = (e.target && e.target.tagName) || '';
    if (/INPUT|SELECT|TEXTAREA/.test(field)) return;
    e.preventDefault();
    toggleFreeRecording();
    return;
  }
  const k = e.key.toLowerCase();
  if (k !== 'q' && k !== 'e') return;
  const tag = (e.target && e.target.tagName) || '';
  if (/INPUT|SELECT|TEXTAREA/.test(tag)) return;   // don't hijack form fields
  const axis = new THREE.Vector3().subVectors(controls.target, camera.position).normalize();
  camera.up.applyAxisAngle(axis, (k === 'q' ? 1 : -1) * 0.06);
  controls.update();
  scheduleControlsRebuild();
});

/* =====================================================================
 *  Loop
 * ===================================================================== */
function animate(now) {
  requestAnimationFrame(animate);
  const rec = state.recording;
  const t = now ?? performance.now();
  if (rec && rec.mode === 'driver') {
    if (rec.start == null) rec.start = t;
    const progress = clamp01((t - rec.start) / rec.durationMs);
    rec.driver(progress);
    renderer.setScissorTest(false);
    renderer.setViewport(0, 0, innerWidth, innerHeight);
    renderer.render(scene, camera);
    if (!recOpts.hideGizmo) renderGizmo();
    compositeFrame();
    if (progress >= 1) stopRecording();
    return;
  }
  // normal loop (also used for 'live' recording)
  stepAnim(t);
  controls.update();
  if (_readoutDirty) { _readoutDirty = false; updateReadout(); }
  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, innerWidth, innerHeight);
  renderer.render(scene, camera);
  if (!(rec && recOpts.hideGizmo)) renderGizmo();
  if (rec && rec.mode === 'live') {
    if (rec.start == null) rec.start = t;
    compositeFrame();
    if (clamp01((t - rec.start) / rec.durationMs) >= 1) stopRecording();
  }
}
animate();
applyState();

// Direktlinks: ?demo lädt die Demo-Map, ?src=<url> lädt Mesh ODER Rohexport
// (.000 Rhythmia, .zip CARTO, .xml EnSite).
async function loadURL(url) {
  showLoading('Lade…');
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    setLoading('Konvertiere…');
    await new Promise(r => requestAnimationFrame(() => r()));
    const buf = await res.arrayBuffer();
    const name = (url.split('/').pop() || 'mesh').split('?')[0];
    const lower = name.toLowerCase();
    if (/\.(ply|obj|stl)$/.test(lower)) {
      let data;
      if (lower.endsWith('.obj')) data = EP.parseOBJ(new TextDecoder().decode(buf));
      else if (lower.endsWith('.stl')) data = EP.parseSTL(buf);
      else data = EP.parsePLY(buf);
      if (!data.positions.length) throw new Error('Keine Geometrie gefunden.');
      loadGeometry(data, name);
      return;
    }
    // Rohexport
    let meshes;
    if (lower.endsWith('.zip')) {
      const { unzipSync } = await import('../vendor/fflate.module.js?v=76e45eb3ef80');
      meshes = EP.parseCarto(new Uint8Array(buf), unzipSync);
    } else if (lower.endsWith('.xml')) {
      meshes = EP.parseEnSite(new TextDecoder().decode(buf));
    } else {
      meshes = await EP.parseRhythmia(new Uint8Array(buf));   // .000 (einteilig)
    }
    if (!meshes.length) throw new Error('Keine Mesh-Daten gefunden.');
    rawMeshes = meshes;
    populateMeshSelector(meshes);
    loadParsedMesh(meshes[0]);
  } catch (err) {
    alert('Laden fehlgeschlagen:\n' + err.message);
    console.error(err);
  } finally {
    hideLoading();
  }
}
const _params = new URLSearchParams(location.search);
const _v = (_params.get('view') || '').toUpperCase();
if (_v in VIEW_ANGLES) initialView = _v;
if (_params.has('demo')) {
  loadDemo().catch(e => console.error('demo failed', e));
} else if (_params.get('src')) {
  loadURL(_params.get('src'));
} else {
  /* A shared map: /view/<id>. The path is the link people paste, so the id
   * comes from it rather than from a query string — and the same page serves
   * both, because nginx hands /view/<id> to this file unchanged. */
  const shared = location.pathname.match(/\/view\/([A-Za-z0-9_-]{16,64})$/);
  if (shared) {
    loadURL(`/maps/${shared[1]}.ply`).catch((e) => {
      console.error('shared map failed', e);
      // 410 means the link outlived the map. That is a different thing from a
      // broken link and the reader should be told which.
      const message = String(e && e.message || e);
      alert(/410|expired/i.test(message)
        ? 'Dieser Link ist abgelaufen. Geteilte Karten werden nach der '
          + 'vereinbarten Frist gelöscht.'
        : 'Die geteilte Karte konnte nicht geladen werden.');
    });
  }
}

 * else the menu can send is routed back to the signal view by the bridge. */
import '../shared/bridge.js?v=76e45eb3ef80';

/* Der eigene Weg hinein — nur wo es keinen anderen gibt.
 *
 * Auf epcore.app ist dieser Knopf die einzige Möglichkeit, eine Karte zu
 * öffnen. In der Schale steht "Öffnen" in der Leiste und gilt für beide
 * Module; derselbe Knopf zweimal ist eine zweite Antwort auf eine schon
 * beantwortete Frage. Das Ablegen per Maus bleibt in beiden Fällen.
 *
 * Hier unten, nicht oben im Hauptskript: `window.epcore` entsteht erst mit
 * diesem Import, und die Frage "stecke ich in der Schale?" hat vorher keine
 * Antwort. */
if (window.epcore.inShell()) {
  for (const id of ['pick-dir', 'pick']) {
    const el = document.getElementById(id);
    if (el) el.hidden = true;
  }
  const dropdown = document.getElementById('t-open')?.closest('.tdrop');
  if (dropdown) dropdown.hidden = true;
}

window.epcoreNotify = (msg) => { console.warn('[epcore]', msg); alert(msg); };

window.epcore.register({
  // Ein Pfad aus dem nativen Dialog: gelesen wird über den Backend-Weg, weil
  // eine Seite keine Datei von der Platte aufmachen kann. Eigener Name, weil
  // `openPath` der Signalansicht gehört — dieselbe Aktion an zwei Module wäre
  // ein Zufall darüber, wer zuletzt geladen hat.
  openMapPath: (payload) => { if (payload && payload.path) openPath(payload.path); },
  // Ordner, nicht Einzeldatei: ein Rhythmia-Export ist ein Verzeichnis aus
  // .000/.001-Teilen und ein CARTO-Export eines aus Meshes. Die Menü-Aktion
  // klickte das Datei-Feld — damit ließ sich über die Leiste keiner der beiden
  // öffnen, nur über den Knopf in dieser Ansicht.
  openMap: () => document.getElementById('file-dir')?.click(),
  openMapFile: () => document.getElementById('file')?.click(),
  exportMap: () => document.getElementById('ex-ply')?.click(),
});
</script>
</body>
</html>
